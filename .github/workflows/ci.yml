name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          for f in install.sh uninstall.sh init.sh bin/* lib/*.sh prompt/*.sh tests/*.sh; do
            bash -n "$f" || exit 1
          done
      - name: ShellCheck
        run: shellcheck -S warning install.sh uninstall.sh init.sh bin/* lib/*.sh prompt/*.sh tests/*.sh

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gawk jq
      - name: Install, run and uninstall in a scratch home
        run: tests/smoke.sh
